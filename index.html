<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tu Marca | Gorras y buzos</title>
<meta name="description" content="Gorras y buzos con estilo. Pide directo por WhatsApp.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Hanken+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef0f3;--ink:#15203b;--muted:#5d6579;--accent:#2447f9;--card:#fff;--line:#d9dde5;--wa:#128c4a}
*{box-sizing:border-box;margin:0}
body{font:16px/1.5 "Hanken Grotesk",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
h1,h2,.brand{font-family:"Big Shoulders Display",Impact,sans-serif;font-weight:900;line-height:.95}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:12px 5vw;background:rgba(238,240,243,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{font-size:28px;text-decoration:none;letter-spacing:.01em}
.top nav{display:flex;gap:18px;font-weight:600;font-size:15px}
.top nav a{text-decoration:none;color:var(--muted)}.top nav a:hover{color:var(--accent)}
.hero{padding:7vw 5vw 4vw;max-width:1200px;margin:auto}
.hero h1{font-size:clamp(52px,12vw,150px);letter-spacing:-.01em}
.hero p{max-width:34ch;margin:18px 0 24px;color:var(--muted);font-size:18px}
.btn{display:inline-block;border:0;cursor:pointer;font:700 15px "Hanken Grotesk",sans-serif;padding:12px 22px;border-radius:999px;background:var(--accent);color:#fff;text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.sm{padding:8px 14px;font-size:13px}.btn.red{background:#c62828}
main{max-width:1200px;margin:auto;padding:0 5vw}
.cat{display:grid;grid-template-columns:1fr;gap:20px;margin:36px 0 56px;scroll-margin-top:70px}
.banner{background:var(--ink);color:#fff;border-radius:6px;padding:22px;display:flex;flex-direction:column;justify-content:space-between;gap:14px}
.cat:nth-of-type(even) .banner{background:var(--accent)}
.banner h2{font-size:clamp(44px,9vw,64px)}
.banner p{opacity:.8;font-size:15px;max-width:26ch}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;overflow:hidden;display:flex;flex-direction:column}
.ph{position:relative;aspect-ratio:4/5;background:linear-gradient(135deg,#dfe3ec,#c6ccda)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.tag{position:absolute;top:8px;left:8px;background:var(--ink);color:#fff;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px}
.info{padding:12px;display:flex;flex-direction:column;gap:8px;flex:1}
.info h3{font-size:16px;line-height:1.25}
.price{font-weight:700;font-size:18px}
.desc{color:var(--muted);font-size:13.5px}
.sizes{display:flex;flex-wrap:wrap;gap:6px}
.sizes button{font:600 13px "Hanken Grotesk",sans-serif;min-width:38px;padding:5px 10px;border:1.5px solid var(--line);background:#fff;border-radius:6px;cursor:pointer}
.sizes button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.wa{margin-top:auto;text-align:center;background:var(--wa);color:#fff;text-decoration:none;font-weight:700;font-size:14px;padding:10px;border-radius:6px}
.wa.off{background:#9aa1b0;pointer-events:none}
.empty{grid-column:1/-1;padding:40px;text-align:center;color:var(--muted)}
footer{background:var(--ink);color:#cfd6e6;margin-top:40px;padding:36px 5vw;text-align:center}
footer .links{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:18px}
footer .links a{border:1px solid #3a4768;padding:8px 16px;border-radius:999px;text-decoration:none;font-weight:600;font-size:14px}
footer .links a:hover{background:var(--accent);border-color:var(--accent);color:#fff}
#secret{display:inline-block;font-size:13px;opacity:.75;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.fab{position:fixed;right:16px;bottom:16px;z-index:6;display:flex;align-items:center;gap:8px;background:var(--wa);color:#fff;text-decoration:none;font-weight:700;padding:12px 18px;border-radius:999px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.fab svg{width:20px;height:20px}
dialog{border:0;border-radius:8px;padding:0;width:min(940px,96vw);max-height:92vh;overflow:auto;color:var(--ink)}
dialog::backdrop{background:rgba(10,16,32,.6)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:1}
.dh h2{font-size:32px}.db{padding:20px}
form.f{display:grid;grid-template-columns:1fr 1fr;gap:12px}
form.f label{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:14px}
form.f .w{grid-column:1/-1}
input,select,textarea{font:inherit;padding:9px 10px;border:1.5px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}
.chk{flex-direction:row!important;align-items:center;gap:8px!important}
.prev{width:90px;height:112px;object-fit:cover;border-radius:6px;background:var(--bg)}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.row img,.row i{width:48px;height:60px;object-fit:cover;border-radius:4px;background:var(--bg);flex:none}
.row div{flex:1;min-width:0}.row small{color:var(--muted)}
.msg{color:#c62828;font-size:14px;min-height:20px}
@media(min-width:900px){
 .cat{grid-template-columns:230px 1fr;align-items:start}
 .banner{position:sticky;top:84px;min-height:380px}
 .banner h2{writing-mode:vertical-rl;transform:rotate(180deg);font-size:84px;align-self:flex-start}
 .grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
 .info{padding:14px}
}
@media(max-width:560px){form.f{grid-template-columns:1fr}.top nav{gap:12px}}
@media(prefers-reduced-motion:no-preference){.card{transition:transform .15s}.card:hover{transform:translateY(-3px)}}
</style>
</head>
<body>
<header class="top"><a class="brand" href="#">Tu Marca</a><nav id="nav"></nav></header>

<section class="hero">
  <h1>Gorras y buzos con actitud</h1>
  <p>Diseños para el día a día. Escoge tu talla y pídelo por WhatsApp en un toque.</p>
  <a class="btn" href="#catalogo">Ver productos</a>
</section>

<main id="catalogo"><div class="empty">Cargando productos…</div></main>

<footer id="contacto">
  <div class="links" id="social"></div>
  <span id="secret">© <span id="yr"></span> Tu Marca. Todos los derechos reservados.</span>
</footer>

<a class="fab" id="fab" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15L2 22l5.2-1.4A10 10 0 1 0 12 2z"/></svg>Escríbenos</a>

<dialog id="adm">
  <div class="dh"><h2 id="admT">Administrador</h2><div><button class="btn ghost sm" id="out" hidden>Cerrar sesión</button> <button class="btn ghost sm" id="x">Cerrar</button></div></div>
  <div class="db">
    <form id="login" class="f">
      <label class="w">Correo<input type="email" id="em" required autocomplete="username"></label>
      <label class="w">Contraseña<input type="password" id="pw" required autocomplete="current-password"></label>
      <div class="w"><button class="btn">Entrar</button></div>
    </form>
    <div id="panel" hidden>
      <form id="pf" class="f">
        <input type="hidden" id="pid">
        <label>Nombre<input id="pn" required></label>
        <label>Categoría<input id="pc" list="cats" required placeholder="Gorras"><datalist id="cats"><option value="Gorras"><option value="Buzos"></datalist></label>
        <label>Precio (COP)<input type="number" id="pp" min="0" step="500" required></label>
        <label>Tallas (separadas por coma)<input id="ps" placeholder="S, M, L, XL"></label>
        <label class="w">Descripción<textarea id="pd" rows="2"></textarea></label>
        <label>Foto<input type="file" id="pimg" accept="image/*"></label>
        <div><img class="prev" id="prev" alt="" hidden></div>
        <label class="chk w"><input type="checkbox" id="pa" checked> Disponible</label>
        <div class="w"><button class="btn" id="sv">Guardar producto</button> <button type="button" class="btn ghost" id="cl">Limpiar</button></div>
      </form>
      <div style="margin-top:22px" id="alist"></div>
    </div>
    <p class="msg" id="msg"></p>
  </div>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ====== CONFIGURA AQUÍ ====== */
const CFG={
  SUPABASE_URL:'https://lffgkjvftqkztzrcruqf.supabase.co',
  SUPABASE_KEY:'sb_publishable_ksBAS6laO-jL1ib3Y5uzpA_zDObxFZX',
  WHATSAPP:'573169606116',            // país + número, sin + ni espacios
  STORE:'Alta Casta',
  SOCIAL:{Instagram:'',Facebook:'',TikTok:''},   // pega aquí tus enlaces
  CAT_ORDER:['gorras','buzos'],
  CAT_INFO:{gorras:'Para completar el look.',buzos:'Comodidad todo el día.'}
};
/* ============================ */
const DEMO=CFG.SUPABASE_URL.includes('TU-PROYECTO');
const sb=DEMO?null:supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_KEY);
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(n);
const slug=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-');
const wa=t=>`https://wa.me/${CFG.WHATSAPP}?text=${encodeURIComponent(t)}`;
let products=[];
const DEMO_DATA=[
 {id:'1',name:'Gorra Snapback Negra',category:'Gorras',price:65000,sizes:['Única'],description:'Visera plana, ajustable.',available:true},
 {id:'2',name:'Gorra Trucker Azul',category:'Gorras',price:58000,sizes:['Única'],description:'Malla trasera transpirable.',available:true},
 {id:'3',name:'Buzo Oversize Gris',category:'Buzos',price:135000,sizes:['S','M','L','XL'],description:'Algodón frisado, capota doble.',available:true},
 {id:'4',name:'Buzo Cuello Redondo',category:'Buzos',price:115000,sizes:['M','L'],description:'Corte clásico.',available:false}];

function prodMsg(p,size){return `Hola ${CFG.STORE}, me interesa este producto:\n*${p.name}* (${p.category})\n${size?'Talla: '+size+'\n':''}Precio: ${money(p.price)}\n¿Está disponible?`}

async function load(){
  if(DEMO)products=DEMO_DATA;
  else{const{data,error}=await sb.from('products').select('*').order('created_at');products=error?[]:data;}
  render();
}
function render(){
  const groups={};products.forEach(p=>{(groups[p.category]??=[]).push(p)});
  const rank=c=>{const i=CFG.CAT_ORDER.indexOf(slug(c));return i<0?99:i};
  const cats=Object.keys(groups).sort((a,b)=>rank(a)-rank(b));
  $('nav').innerHTML=cats.map(c=>`<a href="#${slug(c)}">${esc(c)}</a>`).join('')+'<a href="#contacto">Contacto</a>';
  $('catalogo').innerHTML=cats.length?cats.map(c=>`
   <section class="cat" id="${slug(c)}">
    <aside class="banner"><h2>${esc(c)}</h2><p>${esc(CFG.CAT_INFO[slug(c)]||'Nueva colección.')} ${groups[c].length} ${groups[c].length==1?'producto':'productos'}.</p></aside>
    <div class="grid">${groups[c].map(card).join('')}</div>
   </section>`).join(''):'<div class="empty">Pronto tendremos productos nuevos.</div>';
}
function card(p){
  const sizes=(p.sizes||[]);const first=sizes[0]||'';
  return `<article class="card" data-id="${p.id}">
   <div class="ph">${p.image_url?`<img src="${esc(p.image_url)}" alt="${esc(p.name)}" loading="lazy">`:''}${p.available===false?'<span class="tag">Agotado</span>':''}</div>
   <div class="info"><h3>${esc(p.name)}</h3><div class="price">${money(p.price)}</div>
   ${p.description?`<p class="desc">${esc(p.description)}</p>`:''}
   ${sizes.length?`<div class="sizes" role="group" aria-label="Talla">${sizes.map((s,i)=>`<button type="button" data-s="${esc(s)}" class="${i?'':'on'}">${esc(s)}</button>`).join('')}</div>`:''}
   <a class="wa ${p.available===false?'off':''}" target="_blank" rel="noopener" href="${wa(prodMsg(p,first))}">Pedir por WhatsApp</a></div></article>`;
}
$('catalogo').addEventListener('click',e=>{
  const b=e.target.closest('.sizes button');if(!b)return;
  const c=b.closest('.card'),p=products.find(x=>String(x.id)===c.dataset.id);
  c.querySelectorAll('.sizes button').forEach(x=>x.classList.toggle('on',x===b));
  c.querySelector('.wa').href=wa(prodMsg(p,b.dataset.s));
});

/* pie de página */
$('yr').textContent=new Date().getFullYear();
$('fab').href=wa(`Hola ${CFG.STORE}, quiero más información.`);
$('social').innerHTML=Object.entries(CFG.SOCIAL).filter(([,u])=>u).map(([n,u])=>`<a href="${esc(u)}" target="_blank" rel="noopener">${n}</a>`).join('')+`<a href="${wa('Hola, quiero más información.')}" target="_blank" rel="noopener">WhatsApp</a>`;

/* acceso admin: mantener presionado el texto del pie ~1 segundo */
let tm;const sec=$('secret');
const start=()=>{tm=setTimeout(openAdmin,1000)},stop=()=>clearTimeout(tm);
sec.addEventListener('pointerdown',start);
['pointerup','pointerleave','pointercancel'].forEach(ev=>sec.addEventListener(ev,stop));
sec.addEventListener('contextmenu',e=>e.preventDefault());

/* ====== ADMIN ====== */
const dlg=$('adm'),say=(t,ok)=>{$('msg').style.color=ok?'#128c4a':'#c62828';$('msg').textContent=t||''};
async function openAdmin(){
  if(DEMO){alert('Primero conecta Supabase: edita SUPABASE_URL y SUPABASE_KEY en index.html.');return;}
  dlg.showModal();const{data}=await sb.auth.getSession();gate(!!data.session);
}
function gate(on){$('login').hidden=on;$('panel').hidden=!on;$('out').hidden=!on;$('admT').textContent=on?'Gestionar productos':'Administrador';say('');if(on)alist()}
$('x').onclick=()=>dlg.close();
$('login').onsubmit=async e=>{e.preventDefault();
  const{error}=await sb.auth.signInWithPassword({email:$('em').value,password:$('pw').value});
  if(error)return say('Correo o contraseña incorrectos.');$('pw').value='';gate(true)};
$('out').onclick=async()=>{await sb.auth.signOut();gate(false)};
function alist(){
  $('alist').innerHTML=products.length?products.map(p=>`<div class="row">${p.image_url?`<img src="${esc(p.image_url)}" alt="">`:'<i></i>'}
   <div><b>${esc(p.name)}</b><br><small>${esc(p.category)} · ${money(p.price)}${p.available===false?' · Agotado':''}</small></div>
   <button class="btn ghost sm" data-e="${p.id}">Editar</button><button class="btn red sm" data-d="${p.id}">Eliminar</button></div>`).join(''):'<p class="desc">Aún no hay productos. Crea el primero arriba.</p>';
}
function clear(){$('pf').reset();$('pid').value='';$('prev').hidden=true;$('pa').checked=true}
$('cl').onclick=()=>{clear();say('')};
$('pimg').onchange=e=>{const f=e.target.files[0];if(f){$('prev').src=URL.createObjectURL(f);$('prev').hidden=false}};
$('alist').onclick=async e=>{
  const ed=e.target.dataset.e,dl=e.target.dataset.d;
  if(ed){const p=products.find(x=>String(x.id)===ed);
    $('pid').value=p.id;$('pn').value=p.name;$('pc').value=p.category;$('pp').value=p.price;
    $('ps').value=(p.sizes||[]).join(', ');$('pd').value=p.description||'';$('pa').checked=p.available!==false;
    $('prev').src=p.image_url||'';$('prev').hidden=!p.image_url;say('Editando “'+p.name+'”. Guarda cuando termines.',true);dlg.scrollTo({top:0,behavior:'smooth'})}
  if(dl){const p=products.find(x=>String(x.id)===dl);
    if(!confirm('¿Eliminar “'+p.name+'”? No se puede deshacer.'))return;
    const{error}=await sb.from('products').delete().eq('id',dl);
    if(error)return say('No se pudo eliminar: '+error.message);
    if(p.image_url&&p.image_url.includes('/productos/'))await sb.storage.from('productos').remove([p.image_url.split('/productos/')[1]]);
    await load();alist();say('Producto eliminado.',true)}
};
const shrink=(f,max=1100)=>new Promise(r=>{const i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);c.toBlob(r,'image/jpeg',.82)};i.src=URL.createObjectURL(f)});
$('pf').onsubmit=async e=>{e.preventDefault();$('sv').disabled=true;say('Guardando…',true);
  try{
    const id=$('pid').value,file=$('pimg').files[0];
    const row={name:$('pn').value.trim(),category:$('pc').value.trim(),price:Number($('pp').value),
      sizes:$('ps').value.split(',').map(s=>s.trim()).filter(Boolean),description:$('pd').value.trim(),available:$('pa').checked};
    if(file){const path=`${Date.now()}-${Math.random().toString(36).slice(2,8)}.jpg`;
      const up=await sb.storage.from('productos').upload(path,await shrink(file),{contentType:'image/jpeg'});
      if(up.error)throw up.error;row.image_url=sb.storage.from('productos').getPublicUrl(path).data.publicUrl}
    const r=id?await sb.from('products').update(row).eq('id',id):await sb.from('products').insert(row);
    if(r.error)throw r.error;
    clear();await load();alist();say('Producto guardado.',true);
  }catch(err){say('Error: '+err.message)}
  $('sv').disabled=false};

load();
</script>
</body>
</html>
