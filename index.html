<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("theme")||"dark"}catch(e){document.documentElement.dataset.theme="dark"}</script>
<title>GORRAX | Gorras, buzos, relojes y actitud</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a0a0a'/%3E%3Cpath d='M10 46 6 20l16 12 10-18 10 18 16-12-4 26z' fill='%23e2b53f'/%3E%3Crect x='12' y='50' width='40' height='5' rx='2' fill='%23e2b53f'/%3E%3C/svg%3E">
<meta name="description" content="Gorras, buzos y relojes con estilo. Pide directo por WhatsApp.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Hanken+Grotesk:wght@400;600;700&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--panel:#141414;--line:#2a2a2a;--ink:#f3f0e8;--muted:#9b978c;--gold:#e2b53f;--wa:#1fa855}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
body{font:16px/1.5 "Hanken Grotesk",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
h1,h2,h3.t,.hand{font-family:"Big Shoulders Display",Impact,sans-serif;font-weight:900;line-height:.95}
.hand{font-family:"Permanent Marker","Big Shoulders Display",cursive;font-weight:400;line-height:1.2}
a{color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.top{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px 16px;padding:8px 5vw;background:rgba(10,10,10,.93);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.logo{height:54px;display:block}
.top nav{display:flex;gap:22px;justify-content:center}
.nv{position:relative;display:inline-flex;overflow:hidden;text-decoration:none;color:var(--gold);background:#0f0f0f;border:2px solid var(--gold);transform:skewX(-14deg);transition:box-shadow .3s,transform .15s}
.nv .in{position:relative;z-index:1;display:flex;align-items:center;gap:9px;padding:8px 22px;transform:skewX(14deg);font:800 22px "Big Shoulders Display",sans-serif;font-style:italic;letter-spacing:.04em;transition:color .3s}
.nv .in svg{width:26px;height:26px;transition:transform .45s cubic-bezier(.3,1.8,.5,1)}
.nv::before{content:"";position:absolute;inset:-2px -30%;background:var(--gold);transform:translateX(-110%);transition:transform .45s cubic-bezier(.7,0,.2,1)}
.nv::after{content:"";position:absolute;top:0;bottom:0;left:-30%;width:18%;z-index:2;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(255,255,255,.8),transparent)}
.nv:hover::before,.nv:focus-visible::before{transform:none}
.nv:hover .in,.nv:focus-visible .in{color:#000}
.nv:hover .in svg,.nv:focus-visible .in svg{transform:rotate(-14deg) scale(1.28)}
.nv:hover,.nv:focus-visible{box-shadow:0 0 0 2px #0a0a0a,0 0 0 4px var(--gold),0 8px 26px rgba(226,181,63,.4)}
.nv:hover::after{animation:shine .7s .12s}
.nv:active{transform:skewX(-14deg) scale(.95)}
@keyframes shine{from{left:-30%}to{left:130%}}
.ctc{justify-self:end}.ctc .in{font-size:18px;padding:6px 18px}.ctc .in svg{width:20px;height:20px}
.noimg{position:absolute;inset:0;display:grid;place-items:center;color:#2c2c2c}.noimg svg{width:40%;height:auto}
.hero{position:relative;max-width:100%;margin:auto}
.hero img{width:100%;height:clamp(250px,46vw,500px);object-fit:cover;object-position:center;display:block}
.hero::after{content:"";position:absolute;inset:auto 0 0;height:35%;background:linear-gradient(transparent,var(--bg))}
.hero .btn{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);z-index:1}
.btn{display:inline-block;border:0;cursor:pointer;font:800 15px "Hanken Grotesk",sans-serif;padding:13px 28px;border-radius:999px;background:var(--gold);color:#000;text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.sm{padding:8px 14px;font-size:13px}.btn.red{background:#c62828;color:#fff}
.feat{max-width:1200px;margin:0 auto;padding:10px 5vw 0;display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.feat div{display:flex;align-items:center;gap:12px;font-weight:700;font-size:13.5px;line-height:1.25}
.feat svg{width:34px;height:34px;flex:none;color:var(--gold)}
main{max-width:1600px;margin:auto;padding:0 5vw}
.cat{display:grid;grid-template-columns:1fr;gap:20px;margin:40px 0 56px;scroll-margin-top:90px}
.banner{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:22px;display:flex;flex-direction:column;justify-content:space-between;gap:14px}
.banner h2{font-size:clamp(46px,10vw,66px);font-style:italic;color:var(--gold)}
.banner p{color:var(--muted);font-size:20px}
.cat:nth-of-type(even) .banner{background:var(--gold);border-color:var(--gold)}
.cat:nth-of-type(even) .banner h2{color:#000}.cat:nth-of-type(even) .banner p{color:#2a2208}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden;display:flex;flex-direction:column}
.ph{position:relative;aspect-ratio:4/5;background:linear-gradient(135deg,#1d1d1d,#101010)}
.ph img{position:relative;z-index:1;width:100%;height:100%;object-fit:cover;display:block}
.tag{z-index:2;position:absolute;top:8px;left:8px;background:var(--gold);color:#000;font-size:12px;font-weight:800;padding:3px 10px;border-radius:999px}
.info{padding:12px;display:flex;flex-direction:column;gap:8px;flex:1}
.info h3{font-size:16px;line-height:1.25}
.price{font-weight:800;font-size:19px;color:var(--gold)}
.desc{color:var(--muted);font-size:13.5px}
.sizes{display:flex;flex-wrap:wrap;gap:6px}
.sizes button{font:700 13px "Hanken Grotesk",sans-serif;min-width:38px;padding:5px 10px;border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:6px;cursor:pointer}
.sizes button.on{background:var(--gold);color:#000;border-color:var(--gold)}
.wa{margin-top:auto;text-align:center;background:var(--wa);color:#fff;text-decoration:none;font-weight:800;font-size:14px;padding:10px;border-radius:6px}
.wa.off{background:#3a3a3a;color:#888;pointer-events:none}
.empty{grid-column:1/-1;padding:40px;text-align:center;color:var(--muted)}
footer{background:#000;border-top:1px solid var(--line);margin-top:40px;padding:40px 5vw;text-align:center}
footer .hand{color:var(--gold);font-size:24px;margin-bottom:16px}
footer .links{display:flex;gap:12px;justify-content:center;margin-bottom:20px}
footer .links a{width:46px;height:46px;display:grid;place-items:center;border:1.5px solid var(--line);border-radius:50%;color:var(--ink)}
footer .links a:hover{background:var(--gold);border-color:var(--gold);color:#000}
footer .links svg{width:22px;height:22px}
#secret{display:inline-block;font-size:13px;color:var(--muted);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.fab{position:fixed;right:16px;bottom:16px;z-index:6;display:flex;align-items:center;gap:8px;background:var(--wa);color:#fff;text-decoration:none;font-weight:800;padding:12px 18px;border-radius:999px;box-shadow:0 6px 18px rgba(0,0,0,.5)}
.fab svg{width:20px;height:20px}
dialog{border:1px solid var(--line);border-radius:8px;padding:0;width:min(940px,96vw);max-height:92vh;overflow:auto;background:var(--panel);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.75)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:1}
.dh h2{font-size:32px;color:var(--gold)}.db{padding:20px}
form.f{display:grid;grid-template-columns:1fr 1fr;gap:12px}
form.f label{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:14px}
form.f .w{grid-column:1/-1}
input,select,textarea{font:inherit;padding:9px 10px;border:1.5px solid var(--line);border-radius:6px;background:#0d0d0d;color:var(--ink)}
.chk{flex-direction:row!important;align-items:center;gap:8px!important}
.prev{width:90px;height:112px;object-fit:cover;border-radius:6px;background:#0d0d0d}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.row img,.row i{width:48px;height:60px;object-fit:cover;border-radius:4px;background:#0d0d0d;flex:none}
.row div{flex:1;min-width:0}.row small{color:var(--muted)}
.msg{color:#ff6b6b;font-size:14px;min-height:20px}
@media(min-width:760px){.feat{grid-template-columns:repeat(4,1fr)}}
@media(min-width:900px){
 .cat{grid-template-columns:230px 1fr;align-items:start}
 .banner{position:sticky;top:92px;min-height:400px}
 .banner h2{writing-mode:vertical-rl;transform:rotate(180deg);font-size:88px;align-self:flex-start}
 .grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
 .info{padding:14px}
}
@media(max-width:640px){.top{grid-template-columns:1fr auto}.top nav{grid-column:1/-1;grid-row:2;gap:14px;flex-wrap:wrap}.nv .in{padding:6px 16px;font-size:20px}.ctc .in{font-size:16px;padding:5px 14px}.logo{height:46px}form.f{grid-template-columns:1fr}}
.card{transition:transform .15s,border-color .15s}.card:hover{transform:translateY(-3px);border-color:var(--gold)}

/* ===== Menú a todo el alto + banners con cambio de color en diagonal ===== */
.top{padding:0 5vw;gap:0 16px;min-height:70px}
.top>a:first-child{padding:8px 0}
.top nav{align-self:stretch;gap:0}
.nv{align-self:stretch;border:0;border-left:1px solid var(--line);border-right:1px solid var(--line);margin-left:-1px;background:transparent;box-shadow:none!important}
.nv .in{padding:0 30px}
.ctc,.ctc .in{align-self:stretch}.ctc .in{padding:0 22px}
.banner{position:relative;overflow:hidden;isolation:isolate;transition:border-color .4s}
.banner h2,.banner p{position:relative;z-index:1;transition:color .4s .1s}
.banner::before{content:"";position:absolute;z-index:0;left:0;right:0;top:-30%;bottom:-30%;background:var(--gold);transform:translateY(105%) skewY(-10deg);transition:transform .55s cubic-bezier(.7,0,.2,1)}
.cat:nth-of-type(even) .banner::before{background:var(--panel)}
.banner:hover::before{transform:translateY(0) skewY(-10deg)}
.banner:hover{border-color:var(--gold)}
.banner:hover h2{color:#000}.banner:hover p{color:#2a2208}
.cat:nth-of-type(even) .banner:hover{border-color:var(--line)}
.cat:nth-of-type(even) .banner:hover h2{color:var(--gold)}
.cat:nth-of-type(even) .banner:hover p{color:var(--muted)}
@media(max-width:640px){
 .top{min-height:0}
 .top>a:first-child{padding:6px 0}
 .top nav{margin:0 -5vw;gap:0}
 .nv{flex:1 1 auto;justify-content:center;min-height:46px}
 .nv .in{padding:0 12px;font-size:19px}
 .ctc .in{padding:0 16px;font-size:16px}
}

/* ===== Formas en diagonal para botones, chips, tarjetas y banners (las fuentes no se tocan) ===== */
.btn,.wa,.sizes button,.fab,footer .links a{--sk:12px;--P:polygon(var(--sk) 0,100% 0,calc(100% - var(--sk)) 100%,0 100%);border:0!important;border-radius:0!important;clip-path:var(--P);background:var(--o)!important;color:var(--t1)!important;isolation:isolate;box-shadow:none;transition:color .3s}
.btn,.wa,.sizes button,footer .links a{position:relative}
.btn{--o:var(--gold);--f1:var(--gold);--f2:#0a0a0a;--t1:#000;--t2:var(--gold)}
.btn.ghost{--o:var(--line);--f1:var(--panel);--f2:var(--gold);--t1:var(--ink);--t2:#000}
.btn.ghost:hover,.btn.ghost:focus-visible{--o:var(--gold)}
.btn.red{--o:#c62828;--f1:#c62828;--f2:#0a0a0a;--t1:#fff;--t2:#ff6b6b}
.btn.sm{--sk:9px}
.wa{--o:var(--wa);--f1:var(--wa);--f2:#0a0a0a;--t1:#fff;--t2:var(--wa)}
.wa.off{--o:#3a3a3a;--f1:#3a3a3a;--f2:#3a3a3a;--t1:#888;--t2:#888}
.fab{--sk:14px;--o:var(--wa);--f1:var(--wa);--f2:#0a0a0a;--t1:#fff;--t2:var(--wa)}
.sizes button{--sk:6px;--o:var(--line);--f1:var(--panel);--f2:var(--gold);--t1:var(--ink);--t2:#000}
.sizes button:hover,.sizes button:focus-visible{--o:var(--gold)}
.sizes button.on{--o:var(--gold);--f1:var(--gold);--f2:#0a0a0a;--t1:#000;--t2:var(--gold)}
footer .links a{--sk:10px;--o:var(--line);--f1:#000;--f2:var(--gold);--t1:var(--ink);--t2:#000}
footer .links a:hover,footer .links a:focus-visible{--o:var(--gold)}
.btn::before,.wa::before,.sizes button::before,.fab::before,footer .links a::before{content:"";position:absolute;inset:2px;z-index:-1;clip-path:var(--P);background:linear-gradient(105deg,var(--f2) 50%,var(--f1) 50%) 100% 0/250% 100%;transition:background-position .5s cubic-bezier(.7,0,.2,1)}
.sizes button::before{inset:1.5px}
.btn:hover::before,.wa:hover::before,.sizes button:hover::before,.fab:hover::before,footer .links a:hover::before,
.btn:focus-visible::before,.wa:focus-visible::before,.sizes button:focus-visible::before,.fab:focus-visible::before,footer .links a:focus-visible::before{background-position:0 0}
.btn:hover,.wa:hover,.sizes button:hover,.fab:hover,footer .links a:hover,
.btn:focus-visible,.wa:focus-visible,.sizes button:focus-visible,.fab:focus-visible,footer .links a:focus-visible{color:var(--t2)!important}
.tag{border-radius:0;padding:3px 16px;clip-path:polygon(7px 0,100% 0,calc(100% - 7px) 100%,0 100%)}
.card,.banner{--sk:28px;--P:polygon(var(--sk) 0,100% 0,calc(100% - var(--sk)) 100%,0 100%);clip-path:var(--P);border:0;border-radius:0}
.card{position:relative}
.info{padding:14px calc(14px + var(--sk)) 14px 14px}
.card::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--gold);transform:scaleX(0);transform-origin:left;transition:transform .4s;pointer-events:none}
.card:hover::after{transform:scaleX(1)}
.banner{padding:22px calc(22px + var(--sk))}
@media(min-width:900px){.banner{position:sticky}}
@media(max-width:640px){.card,.banner{--sk:12px}}

/* ===== Efecto de escritura + letras blancas en el menú ===== */
.tw{position:relative;display:inline-block;white-space:nowrap}
.tw .gh{visibility:hidden}
.tw .ty{position:absolute;left:0;top:0}
.tw .ty::after{content:"";display:inline-block;width:2px;height:.95em;margin-left:3px;background:var(--gold);vertical-align:-.1em;animation:blink .9s steps(1) infinite}
.tw.done .ty::after{opacity:0;animation:none}
@keyframes blink{50%{opacity:0}}
.hero-type{position:absolute;left:0;right:0;bottom:0;z-index:1;text-align:center;color:var(--gold);font-size:clamp(15px,2.4vw,30px);padding:34px 0 8px;background:linear-gradient(transparent,var(--bg) 60%);pointer-events:none;text-shadow:0 2px 10px #000}
.nv .in{color:#fff}
.nv .in svg{color:var(--gold)}
.nv:hover .in svg,.nv:focus-visible .in svg{color:#000}

/* ===== Tema claro / oscuro, botón de tema, chips de categoría y 4 columnas ===== */
.hr{justify-self:end;align-self:stretch;display:flex}
button.nv{padding:0;font:inherit;cursor:pointer;color:inherit}
.th .in{padding:0 18px}.th .in svg{width:22px;height:22px}
.th .moon{display:none}
[data-theme=light] .th .sun{display:none}
[data-theme=light] .th .moon{display:block}
.cchips{margin-top:8px}
[data-theme=light]{--bg:#ebebe6;--panel:#ffffff;--line:#d5d5ce;--ink:#16161a;--muted:#5d5a52;--gold:#a87b00}
[data-theme=light] .top{background:rgba(235,235,230,.94)}
[data-theme=light] .nv .in{color:var(--ink)}
[data-theme=light] .ph{background:linear-gradient(135deg,#e4e4de,#d0d0c8)}
[data-theme=light] .noimg{color:#c4c4bc}
[data-theme=light] footer{background:#e2e2dc}
[data-theme=light] footer .links a{--f1:#fff}
[data-theme=light] input,[data-theme=light] select,[data-theme=light] textarea{background:#fff}
[data-theme=light] .prev,[data-theme=light] .row img,[data-theme=light] .row i{background:#e8e8e2}
[data-theme=light] .hero-type{text-shadow:none}
@media(min-width:900px){.grid{grid-template-columns:repeat(auto-fill,minmax(max(210px,calc((100% - 48px)/4)),1fr))}}
@media(max-width:640px){.th .in{padding:0 14px}}

/* ===== Foto completa, galería, lightbox y beneficios ===== */
.ph{cursor:zoom-in;overflow:hidden}
.ph img{object-fit:contain;padding:8px calc(var(--sk) + 2px);transition:transform .35s}
.card:hover .ph img{transform:scale(1.04)}
.cnt{position:absolute;right:calc(var(--sk) + 6px);bottom:8px;z-index:2;background:rgba(0,0,0,.72);color:#fff;font-size:12px;font-weight:800;padding:3px 10px;border-radius:999px}
#lb{width:min(980px,96vw)}
#lb .stage{position:relative;background:#000;display:grid;place-items:center;height:min(64vh,620px)}
#lb .stage img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.lbn{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:72px;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:34px;line-height:1;cursor:pointer;transition:background .2s,color .2s}
.lbn:hover,.lbn:focus-visible{background:var(--gold);color:#000}
.lbn.l{left:0;clip-path:polygon(0 0,100% 0,calc(100% - 12px) 100%,0 100%)}
.lbn.r{right:0;clip-path:polygon(12px 0,100% 0,100% 100%,0 100%)}
.lbt{display:flex;gap:8px;justify-content:center;padding:10px 14px;overflow-x:auto}
.lbt button{flex:none;width:62px;height:62px;padding:0;border:2px solid transparent;background:#000;opacity:.6;cursor:pointer}
.lbt button.on{border-color:var(--gold);opacity:1}
.lbt img{width:100%;height:100%;object-fit:cover;display:block}
.lbf{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 18px 16px}
.lbf .price{font-size:24px}
.gal{display:flex;flex-wrap:wrap;gap:12px}
.gi{position:relative;width:84px;height:104px}
.gi img{width:100%;height:100%;object-fit:cover;border-radius:4px;background:#0d0d0d}
.gi button{position:absolute;top:-7px;right:-7px;width:24px;height:24px;border-radius:50%;border:0;background:#c62828;color:#fff;font-size:16px;line-height:1;cursor:pointer}
.gi em{position:absolute;left:0;right:0;bottom:0;background:var(--gold);color:#000;font:700 11px "Hanken Grotesk",sans-serif;text-align:center}
.feat div:last-child{grid-column:1/-1;justify-content:center}
@media(min-width:760px){.feat{grid-template-columns:repeat(5,1fr)}.feat div:last-child{grid-column:auto;justify-content:flex-start}}
.ph,[data-theme=light] .ph{background:#fff}
.noimg,[data-theme=light] .noimg{color:#d3d3d3}
/* ===== Ventana de fotos: centrada, más pequeña y botón en la esquina ===== */
dialog{margin:auto}
#lb{width:min(740px,94vw);max-height:90vh;overflow:hidden}
#lb[open]{display:flex;flex-direction:column}
#lb .dh{padding:10px 16px}
#lb .dh h2{font-size:24px}
#lb .stage{flex:none;display:flex;align-items:center;justify-content:center;height:min(54vh,440px);padding:0 52px;background:#fff}
#lb .stage img{max-width:100%;max-height:min(54vh,440px);width:auto;height:auto;object-fit:contain}
.lbn{width:40px;height:60px;font-size:30px}
.lbt{padding:8px 14px}
.lbt button{width:48px;height:48px}
.lbf{padding:8px 14px 12px}
.lbf .price{font-size:20px}
.lbf .btn{--sk:9px;padding:8px 16px;font-size:13px;margin-left:auto}
</style>
</head>
<body>

<script>

const money=n=>new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(n);
const slug=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-');

let products=[];
const U=['Única'],T=['S','M','L','XL'],Z=['38','39','40','41','42','43'],W=['40 mm','44 mm'];
const eb=id=>'https://i.ebayimg.com/images/g/'+id+'/s-l500.jpg';
const IMG={
 g:[eb('nl4AAOSw34FVIg3M'),eb('45gAAOSwkcBnDVQ5'),eb('mbkAAOSw7yZnDVQ5')],
 b:[eb('r-kAAeSwXXho8jHC'),eb('zFUAAeSweDhnvWoc'),eb('3esAAOSwLGpgGcnZ')],
 r:[eb('txgAAOSwX41nhman'),eb('0roAAeSwgdNpemXp'),eb('jKQAAeSwVHBobecJ')],
 z:[eb('7wAAAeSwCntpEdLn'),eb('GdcAAeSwpbdpneDT'),eb('pA0AAOSwyuhhBSRT')]};
const mk=(k,cat,rows)=>rows.map((a,i)=>({id:k+i,name:a[0],category:cat,price:a[1],sizes:a[2],description:a[3],image_url:IMG[k][i%3],available:a[4]!==false}));
const DEMO_DATA=[
 ...mk('g','Gorras',[

  ['Fitted plana cerrada',89000,['7 1/4','7 3/8','7 1/2'],'Ajuste exacto, sin broche.'],
  ['Trucker plana de malla',55000,U,'Parte trasera de malla, más fresca.'],
  ['Snapback plana edición oro',72000,U,'Bordado dorado. Edición limitada.',false]]),
 ...mk('b','Buzos',[
  ['Buzo oversize negro',135000,T,'Algodón frisado, capota doble.'],
  ['Buzo canguro premium',148000,T,'Bolsillo frontal, felpa suave.'],
  ['Buzo cuello redondo',115000,['M','L'],'Corte clásico, puño reforzado.'],
  ['Buzo heavyweight con capota',159000,T,'Tela gruesa de 400 g, cordón plano.',false]]),
 ...mk('r','Relojes',[
  ['Reloj clásico negro y dorado',185000,W,'Caja de acero, correa de silicona, resistente al agua.'],
  ['Reloj buceo negro y dorado',240000,['44 mm'],'Cuarzo, bisel giratorio, resistente a 100 m.'],
  ['Reloj deportivo LED',120000,W,'Cronómetro, luz LED y alarma.'],
  ['Reloj minimalista de cuero',210000,['38 mm','42 mm'],'Esfera limpia y correa de cuero.']]),
 ...mk('z','Zapatos',[
  ['Tenis urbanos negros',210000,Z,'Suela antideslizante y plantilla acolchada.'],
  ['Zapatilla cuero negro y gris',245000,Z,'Cuero genuino, ligera y cómoda.'],
  ['Tenis running deportivos',189000,Z,'Malla transpirable para uso diario.'],
  ['Zapatilla casual blanca',199000,['39','40','41'],'Estilo limpio, combina con todo.',false]])
];

function prodMsg(p,size){return `Hola ${CFG.STORE}, me interesa este producto:\n*${p.name}* (${p.category})\n${size?'Talla: '+size+'\n':''}Precio: ${money(p.price)}\n¿Está disponible?`}

async function load(){
  if(DEMO)products=DEMO_DATA;
  else{const{data,error}=await sb.from('products').select('*').order('created_at');products=error?[]:data;}
  render();
}
const NAVICO={
 gorras:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15v-2.5a8 8 0 0 1 16 0V15"/><path d="M2.5 15h14.5c2.6 0 4.5.8 4.5 2H2.5z"/><path d="M12 4.5v3"/></svg>',
 buzos:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3.5 4.5 6 2.5 19.5H6l1-9v10.5h10V10.5l1 9h3.5L19.5 6 15 3.5"/><path d="M9 3.5C9.5 2 10.5 1.5 12 1.5s2.5.5 3 2c0 2-1.5 3.5-3 3.5S9 5.5 9 3.5z"/><path d="M10.5 7.5v3M13.5 7.5v3M9.5 14.5h5l.8 4H8.7z"/></svg>',
 relojes:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5.5"/><path d="M9 6.5 9.8 2.5h4.4L15 6.5M9 17.5l.8 4h4.4l.8-4M12 9.5V12l1.8 1.2"/></svg>',
 zapatos:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17v-3c2 0 3-1 4-3l2 1c1 1 2 1 4 1l4 2c2 1 3 2 3 4H3z"/><path d="M9 11l1.5-2"/></svg>',
 otro:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M3 12 12 3h9v9l-9 9z"/><circle cx="16" cy="8" r="1.3"/></svg>'};
function render(){
  const groups={};products.forEach(p=>{(groups[p.category]??=[]).push(p)});
  const rank=c=>{const i=CFG.CAT_ORDER.indexOf(slug(c));return i<0?99:i};
  const cats=Object.keys(groups).sort((a,b)=>rank(a)-rank(b));
  $('nav').innerHTML=cats.map(c=>`<a class="nv" href="#${slug(c)}"><span class="in">${NAVICO[slug(c)]||NAVICO.otro}${esc(c)}</span></a>`).join('');
  $('catalogo').innerHTML=cats.length?cats.map(c=>`
   <section class="cat" id="${slug(c)}">
    <aside class="banner"><h2>${esc(c)}</h2><p>${esc(CFG.CAT_INFO[slug(c)]||'Nueva colección.')} ${groups[c].length} ${groups[c].length==1?'producto':'productos'}.</p></aside>
    <div class="grid">${groups[c].map(card).join('')}</div>
   </section>`).join(''):'<div class="empty">Pronto tendremos productos nuevos.</div>';
}
function card(p){
  const sizes=(p.sizes||[]);const first=sizes[0]||'';const im=imgs(p);
  return `<article class="card" data-id="${p.id}">
   <div class="ph"><div class="noimg">${NAVICO[slug(p.category)]||NAVICO.otro}</div>${im[0]?`<img src="${esc(im[0])}" alt="${esc(p.name)}" loading="lazy" onerror="this.remove()">`:''}${im.length>1?`<span class="cnt">${im.length} fotos</span>`:''}${p.available===false?'<span class="tag">Agotado</span>':''}</div>
   <div class="info"><h3>${esc(p.name)}</h3><div class="price">${money(p.price)}</div>
   ${p.description?`<p class="desc">${esc(p.description)}</p>`:''}
   ${sizes.length?`<div class="sizes" role="group" aria-label="Talla">${sizes.map((s,i)=>`<button type="button" data-s="${esc(s)}" class="${i?'':'on'}">${esc(s)}</button>`).join('')}</div>`:''}
   <a class="wa ${p.available===false?'off':''}" target="_blank" rel="noopener" href="${wa(prodMsg(p,first))}">Pedir por WhatsApp</a></div></article>`;
}
$('catalogo').addEventListener('click',e=>{
  const b=e.target.closest('.sizes button');if(!b)return;
  const c=b.closest('.card'),p=products.find(x=>String(x.id)===c.dataset.id);
  c.querySelectorAll('.sizes button').forEach(x=>x.classList.toggle('on',x===b));
  c.querySelector('.wa').href=wa(prodMsg(p,b.dataset.s));
});

/* pie de página */
$('yr').textContent=new Date().getFullYear();
$('fab').href=wa(`Hola ${CFG.STORE}, quiero más información.`);
const ICO={
 Instagram:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1.1" fill="currentColor" stroke="none"/></svg>',
 Facebook:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M14 8V6.5c0-.7.3-1 1-1h2V2h-3c-3 0-4.5 1.8-4.5 4.4V8H7v3.5h2.5V22H14V11.5h2.7L17 8z"/></svg>',
 TikTok:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.5 2h-3.2v13.2a2.8 2.8 0 1 1-2.8-2.8c.3 0 .6 0 .8.1V9.2a6 6 0 1 0 5.2 5.9V8.6a7 7 0 0 0 4 1.3V6.7a4 4 0 0 1-4-4.7z"/></svg>',
 WhatsApp:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15L2 22l5.2-1.4A10 10 0 1 0 12 2z"/></svg>'};
$('social').innerHTML=['Instagram','Facebook','TikTok'].map(n=>{const u=CFG.SOCIAL[n];return `<a href="${u?esc(u):'#'}" ${u?'target="_blank" rel="noopener"':''} aria-label="${n}">${ICO[n]}</a>`}).join('')+`<a href="${wa('Hola, quiero más información.')}" target="_blank" rel="noopener" aria-label="WhatsApp">${ICO.WhatsApp}</a>`;
$('stn').textContent=CFG.STORE;

/* acceso admin: mantener presionado el texto del pie ~1 segundo */
let tm;const sec=$('secret');
const start=()=>{tm=setTimeout(openAdmin,1000)},stop=()=>clearTimeout(tm);
sec.addEventListener('pointerdown',start);
['pointerup','pointerleave','pointercancel'].forEach(ev=>sec.addEventListener(ev,stop));
sec.addEventListener('contextmenu',e=>e.preventDefault());

/* ====== ADMIN ====== */
const dlg=$('adm'),say=(t,ok)=>{$('msg').style.color=ok?'#128c4a':'#c62828';$('msg').textContent=t||''};
async function openAdmin(){
  if(DEMO){alert('Primero conecta Supabase: edita SUPABASE_URL y SUPABASE_KEY en index.html.');return;}
  dlg.showModal();const{data}=await sb.auth.getSession();gate(!!data.session);
}
function gate(on){$('login').hidden=on;$('panel').hidden=!on;$('out').hidden=!on;$('admT').textContent=on?'Gestionar productos':'Administrador';say('');if(on)alist()}
$('x').onclick=()=>dlg.close();
$('login').onsubmit=async e=>{e.preventDefault();
  const{error}=await sb.auth.signInWithPassword({email:$('em').value,password:$('pw').value});
  if(error)return say('Correo o contraseña incorrectos.');$('pw').value='';gate(true)};
$('out').onclick=async()=>{await sb.auth.signOut();gate(false)};
function alist(){catChips();
  $('alist').innerHTML=products.length?products.map(p=>`<div class="row">${imgs(p)[0]?`<img src="${esc(imgs(p)[0])}" alt="">`:'<i></i>'}
   <div><b>${esc(p.name)}</b><br><small>${esc(p.category)} · ${money(p.price)}${p.available===false?' · Agotado':''}</small></div>
   <button class="btn ghost sm" data-e="${p.id}">Editar</button><button class="btn red sm" data-d="${p.id}">Eliminar</button></div>`).join(''):'<p class="desc">Aún no hay productos. Crea el primero arriba.</p>';
}
let keep=[],added=[],removed=[];
function gal(){
  $('gal').innerHTML=keep.map((u,i)=>`<div class="gi"><img src="${esc(u)}" alt=""><button type="button" data-k="${i}" aria-label="Quitar foto">×</button>${i===0?'<em>Portada</em>':''}</div>`).join('')+added.map((a,i)=>`<div class="gi"><img src="${a.u}" alt=""><button type="button" data-a="${i}" aria-label="Quitar foto">×</button>${!keep.length&&i===0?'<em>Portada</em>':''}</div>`).join('');
}
function clear(){$('pf').reset();catChips();$('pid').value='';$('pa').checked=true;keep=[];added=[];removed=[];gal()}
$('cl').onclick=()=>{clear();say('')};
$('pimg').onchange=e=>{
  const room=Math.max(5-keep.length-added.length,0),fs=[...e.target.files];
  fs.slice(0,room).forEach(f=>added.push({f,u:URL.createObjectURL(f)}));
  if(fs.length>room)say('Máximo 5 fotos por producto.');
  e.target.value='';gal()};
$('gal').onclick=e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.k!==undefined)removed.push(keep.splice(+b.dataset.k,1)[0]);else added.splice(+b.dataset.a,1);gal()};
$('alist').onclick=async e=>{
  const ed=e.target.dataset.e,dl=e.target.dataset.d;
  if(ed){const p=products.find(x=>String(x.id)===ed);
    $('pid').value=p.id;$('pn').value=p.name;$('pc').value=p.category;catChips();$('pp').value=p.price;
    $('ps').value=(p.sizes||[]).join(', ');$('pd').value=p.description||'';$('pa').checked=p.available!==false;
    keep=[...imgs(p)];added=[];removed=[];gal();say('Editando “'+p.name+'”. Guarda cuando termines.',true);dlg.scrollTo({top:0,behavior:'smooth'})}
  if(dl){const p=products.find(x=>String(x.id)===dl);
    if(!confirm('¿Eliminar “'+p.name+'”? No se puede deshacer.'))return;
    const{error}=await sb.from('products').delete().eq('id',dl);
    if(error)return say('No se pudo eliminar: '+error.message);
    const all=imgs(p).filter(u=>u.includes('/productos/'));if(all.length)await sb.storage.from('productos').remove(all.map(u=>u.split('/productos/')[1]));
    await load();alist();say('Producto eliminado.',true)}
};
const shrink=(f,max=1100)=>new Promise(r=>{const i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);c.toBlob(r,'image/jpeg',.82)};i.src=URL.createObjectURL(f)});
$('pf').onsubmit=async e=>{e.preventDefault();$('sv').disabled=true;say('Guardando…',true);
  try{
    const id=$('pid').value;
    const row={name:$('pn').value.trim(),category:$('pc').value.trim(),price:Number($('pp').value),
      sizes:$('ps').value.split(',').map(s=>s.trim()).filter(Boolean),description:$('pd').value.trim(),available:$('pa').checked};
    const urls=[...keep];
    for(const {f} of added){const path=`${Date.now()}-${Math.random().toString(36).slice(2,8)}.jpg`;
      const up=await sb.storage.from('productos').upload(path,await shrink(f),{contentType:'image/jpeg'});
      if(up.error)throw up.error;urls.push(sb.storage.from('productos').getPublicUrl(path).data.publicUrl)}
    row.image_url=urls[0]||null;row.images=urls;
    const save=x=>id?sb.from('products').update(x).eq('id',id):sb.from('products').insert(x);
    let r=await save(row),aviso='';
    if(r.error&&/images/i.test(r.error.message)){delete row.images;r=await save(row);aviso=' Ejecuta actualizar-fotos.sql en Supabase para guardar varias fotos por producto.'}
    if(r.error)throw r.error;
    const gone=removed.filter(u=>u&&u.includes('/productos/'));
    if(gone.length)await sb.storage.from('productos').remove(gone.map(u=>u.split('/productos/')[1]));
    clear();await load();alist();say('Producto guardado.'+aviso,true);
  }catch(err){say('Error: '+err.message)}
  $('sv').disabled=false};

/* efecto de escritura: empieza cuando el texto entra en pantalla */
function typer(el){
  const text=el.querySelector('.gh').textContent,t=el.querySelector('.ty');let i=0,tm;
  const step=()=>{if(i<=text.length){t.textContent=text.slice(0,i++);tm=setTimeout(step,80+Math.random()*60)}else tm=setTimeout(()=>el.classList.add('done'),1500)};
  return{run(){clearTimeout(tm);el.classList.remove('done');i=0;t.textContent='';tm=setTimeout(step,350)},stop(){clearTimeout(tm);t.textContent=''}};
}
document.querySelectorAll('.tw').forEach(el=>{
  const t=typer(el);
  if(!('IntersectionObserver' in window)){el.querySelector('.ty').textContent=el.querySelector('.gh').textContent;el.classList.add('done');return}
  new IntersectionObserver(([e])=>e.isIntersecting?t.run():t.stop(),{threshold:.6}).observe(el);
});

const CATS_BASE=['Gorras','Buzos','Relojes','Zapatos'];
function catChips(){
  const seen=new Set(),list=[];
  [...CATS_BASE,...products.map(p=>p.category)].forEach(c=>{const k=slug(c||'');if(c&&!seen.has(k)){seen.add(k);list.push(c)}});
  const cur=slug($('pc').value||'');
  $('cchips').innerHTML=list.map(c=>`<button type="button" data-c="${esc(c)}" class="${slug(c)===cur?'on':''}">${esc(c)}</button>`).join('');
}
$('cchips').onclick=e=>{const b=e.target.closest('button');if(!b)return;$('pc').value=b.dataset.c;catChips()};
$('pc').oninput=catChips;
$('themeBtn').onclick=()=>{const d=document.documentElement,t=d.dataset.theme==='light'?'dark':'light';d.dataset.theme=t;try{localStorage.setItem('theme',t)}catch(e){}};

function imgs(p){return p.images&&p.images.length?p.images:(p.image_url?[p.image_url]:[])}
let lbP=null,lbI=0;
function lbShow(i){const a=imgs(lbP);lbI=(i+a.length)%a.length;$('lbI').src=a[lbI];$('lbT').textContent=lbP.name;
  $('lbTh').innerHTML=a.length>1?a.map((u,k)=>`<button type="button" data-k="${k}" class="${k===lbI?'on':''}" aria-label="Foto ${k+1}"><img src="${esc(u)}" alt=""></button>`).join(''):'';
  $('lbP').hidden=$('lbN').hidden=a.length<2}
function lbOpen(id){const p=products.find(x=>String(x.id)===String(id));if(!p||!imgs(p).length)return;
  lbP=p;$('lbPr').textContent=money(p.price);$('lbW').href=wa(prodMsg(p,''));lbShow(0);$('lb').showModal()}
$('catalogo').addEventListener('click',e=>{const ph=e.target.closest('.ph');if(ph)lbOpen(ph.closest('.card').dataset.id)});
$('lbP').onclick=()=>lbShow(lbI-1);$('lbN').onclick=()=>lbShow(lbI+1);$('lbX').onclick=()=>$('lb').close();
$('lbTh').onclick=e=>{const b=e.target.closest('button');if(b)lbShow(+b.dataset.k)};
$('lb').addEventListener('keydown',e=>{if(e.key==='ArrowLeft')lbShow(lbI-1);if(e.key==='ArrowRight')lbShow(lbI+1)});
$('lb').addEventListener('click',e=>{if(e.target===$('lb'))$('lb').close()});
let sx=null;$('lbS').addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});
$('lbS').addEventListener('touchend',e=>{if(sx===null)return;const d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>40)lbShow(lbI+(d<0?1:-1));sx=null});
